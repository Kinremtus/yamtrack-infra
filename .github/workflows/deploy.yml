name: Deploy Code
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ${{ secrets.TARGET_DIR }}
            cd ${{ secrets.TARGET_DIR }}
            if [ ! -d ".git" ]; then
              echo "Сервер чист. Начинаем полное восстановление..."
              rm -rf ..?* .[!.]* *
              git clone git@github.com:${{ github.repository }}.git .
            else
              echo "Сервер жив. Просто обновляем код..."
              git pull origin main
            fi
            echo "✅ Код обновлён"

      - name: Docker Deploy with Rollback
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.TARGET_DIR }}

            echo "Сохраняем текущий образ yamtrack..."
            OLD_IMAGE=$(docker inspect --format='{{.Image}}' yamtrack 2>/dev/null || echo "none")
            echo "Старый образ: $OLD_IMAGE"

            echo "Запускаем деплой..."
            docker-compose pull
            docker-compose up -d --remove-orphans

            echo "Ждём 25 секунд пока приложение запустится..."
            sleep 25

            echo "Проверяем что приложение отвечает..."
            HTTP_CODE=$(docker exec yamtrack python -c "import urllib.request; r = urllib.request.urlopen('http://localhost:8000/'); print(r.status)" 2>/dev/null || echo "000")
            echo "HTTP статус: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Деплой успешен! Чистим старые образы..."
              docker image prune -f
            else
              echo "❌ Приложение не отвечает (HTTP: $HTTP_CODE). Откатываемся..."

              if [ "$OLD_IMAGE" != "none" ]; then
                echo "Останавливаем новый контейнер..."
                docker-compose stop yamtrack

                echo "Принудительно ставим старый образ..."
                docker tag "$OLD_IMAGE" ghcr.io/fuzzygrim/yamtrack:latest

                echo "Поднимаем старый контейнер..."
                docker-compose up -d yamtrack

                echo "Ждём 20 секунд после отката..."
                sleep 20

                HTTP_AFTER=$(docker exec yamtrack python -c "import urllib.request; r = urllib.request.urlopen('http://localhost:8000/'); print(r.status)" 2>/dev/null || echo "000")

                if [ "$HTTP_AFTER" = "200" ] || [ "$HTTP_AFTER" = "301" ] || [ "$HTTP_AFTER" = "302" ]; then
                  echo "✅ Откат успешен! Сервис восстановлен."
                else
                  echo "🔥 Откат не помог. Требуется ручное вмешательство!"
                fi
              else
                echo "⚠️ Старого образа нет — откатываться некуда."
              fi

              exit 1
            fi
