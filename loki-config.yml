auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

limits_config:
  allow_structured_metadata: false

common:
  path_prefix: /loki  
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb         # Заменили boltdb-shipper на tsdb (требование 3.x)
      object_store: filesystem
      schema: v13         # Обновили до v13 для стабильности в 3.5
      index:
        prefix: index_
        period: 24h

